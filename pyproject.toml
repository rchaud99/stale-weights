[project]
name = "staleweights"
version = "0.1.0"
description = "Stale Weights: do LoRA fine-tuned support models keep applying an old policy rule that a new prompt omits? A preregistered study on four open models (Modal: PEFT training, vLLM evaluation)."
readme = "README.md"
authors = [
    { name = "Raghav Chaudhary" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
cloud = [
    "modal>=1.0",
]
