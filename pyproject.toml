[project]
name = "staleweights"
version = "0.1.0"
description = "Stale Weights: does a LoRA fine-tuned support model follow a policy changed in the prompt, or the one in its weights? A local MLX measurement study."
readme = "README.md"
authors = [
    { name = "Raghav Chaudhary" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlx-lm>=0.31.3",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
